<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon.png">
<title>Set a new password — Real lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css?v=11">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="login-wrap">
  <form class="login-card" id="rpForm" novalidate>
    <h1>Set a new password</h1>
    <p class="lc-sub">Choose a new password for your account.</p>

    <div class="lc-msg" id="rp-msg"></div>

    <div class="lc-field">
      <label for="rp-pass">New password</label>
      <div class="lc-pw-wrap">
        <input type="password" id="rp-pass" placeholder="At least 8 characters" autocomplete="new-password">
        <button type="button" class="lc-pw-toggle" data-target="rp-pass">Show</button>
      </div>
    </div>
    <div class="lc-field">
      <label for="rp-pass2">Confirm new password</label>
      <input type="password" id="rp-pass2" placeholder="Re-enter password" autocomplete="new-password">
    </div>

    <button type="submit" class="lc-submit" id="rp-submit">Update password</button>
    <p class="lc-note"><a href="../login/">Back to login</a></p>
  </form>
</main>

<div id="site-footer"></div>

<script>
  window.SITE_ROOT = "../";
  window.SITE_SECTION = null;
  window.SITE_PAGE = "reset-password";
</script>
<script src="../assets/js/nav.js?v=11" defer></script>
<script src="../assets/js/supabase-client.js?v=11"></script>
<script src="../assets/js/auth.js?v=11"></script>
<script>
(function () {
  const form = document.getElementById('rpForm');
  const passEl = document.getElementById('rp-pass');
  const pass2El = document.getElementById('rp-pass2');
  const btn = document.getElementById('rp-submit');
  const msg = document.getElementById('rp-msg');

  function showMsg(t, ok) { msg.textContent = t; msg.className = 'lc-msg ' + (ok ? 'ok' : 'err'); }

  document.querySelectorAll('.lc-pw-toggle').forEach(t => t.addEventListener('click', () => {
    const inp = document.getElementById(t.dataset.target);
    const reveal = inp.type === 'password';
    inp.type = reveal ? 'text' : 'password';
    t.textContent = reveal ? 'Hide' : 'Show';
  }));

  // The recovery link establishes a temporary session (detectSessionInUrl).
  // Verify we actually have one before letting the user set a password.
  (async function checkSession() {
    const sb = await window.getSupabaseClient();
    let session = (await sb.auth.getSession()).data.session;
    if (!session) {
      session = await new Promise((resolve) => {
        const timer = setTimeout(() => resolve(null), 4000);
        sb.auth.onAuthStateChange((_e, s) => { if (s) { clearTimeout(timer); resolve(s); } });
      });
    }
    if (!session) {
      showMsg('This reset link is invalid or has expired. Please request a new one.');
      btn.disabled = true;
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass = passEl.value;
    const pass2 = pass2El.value;
    if (pass.length < 8) { showMsg('Password must be at least 8 characters.'); return; }
    if (pass !== pass2) { showMsg('Passwords do not match.'); return; }
    btn.disabled = true; const o = btn.textContent; btn.textContent = 'Updating…';
    try {
      await RA.updatePassword(pass);
      showMsg('Password updated! Redirecting to login…', true);
      // Sign out the temporary recovery session so they log in fresh.
      try { await RA.signOut(); } catch (_) {}
      setTimeout(() => { window.location.href = SITE_ROOT + 'login/'; }, 1400);
    } catch (err) {
      btn.disabled = false; btn.textContent = o;
      showMsg((err && err.message) || 'Could not update your password.');
    }
  });
})();
</script>
</body>
</html>
