<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon.png">
<title>Log In — Real lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="login-wrap">
  <form class="login-card" onsubmit="return false;">
    <h1>Welcome back</h1>
    <p class="lc-sub">Log in to your Real lingo account.</p>
    <div class="lc-field">
      <label for="li-email">Email</label>
      <input type="email" id="li-email" placeholder="you@example.com" disabled>
    </div>
    <div class="lc-field">
      <label for="li-pass">Password</label>
      <input type="password" id="li-pass" placeholder="••••••••" disabled>
    </div>
    <button type="submit" class="lc-submit" disabled>Log In — Coming Soon</button>
    <p class="lc-note">Login isn't available yet. Check back soon, or <a href="../signup/">take the sign-up quiz</a> instead.</p>
  </form>
</main>

<div id="site-footer"></div>

<script>
  window.SITE_ROOT = "../";
  window.SITE_SECTION = null;
  window.SITE_PAGE = "login";
</script>
<script src="../assets/js/nav.js" defer></script>
</body>
</html>
