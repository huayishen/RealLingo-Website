<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon.png">
<title>Log In — Real lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css?v=25">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="login-wrap">
  <form class="login-card" id="loginForm" novalidate>
    <h1>Welcome back</h1>
    <p class="lc-sub">Log in to your Real lingo account.</p>

    <div class="lc-msg" id="loginMsg"></div>

    <div class="lc-field">
      <label for="li-email">Email</label>
      <input type="email" id="li-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="lc-field">
      <label for="li-pass">Password</label>
      <div class="lc-pw-wrap">
        <input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="lc-pw-toggle" data-target="li-pass">Show</button>
      </div>
    </div>

    <div class="lc-row">
      <label class="lc-check"><input type="checkbox" id="li-remember" checked> Remember me</label>
      <a class="lc-link" href="../forgot-password/">Forgot password?</a>
    </div>

    <button type="submit" class="lc-submit" id="li-submit">Log In</button>
    <p class="lc-note">New to Real lingo? <a href="../signup/">Create an account</a></p>
  </form>
</main>

<div id="site-footer"></div>

<script>
  window.SITE_ROOT = "../";
  window.SITE_SECTION = null;
  window.SITE_PAGE = "login";
</script>
<script src="../assets/js/nav.js?v=25" defer></script>
<script src="../assets/js/supabase-client.js?v=25"></script>
<script src="../assets/js/auth.js?v=25"></script>
<script>
(function () {
  const form = document.getElementById('loginForm');
  const emailEl = document.getElementById('li-email');
  const passEl = document.getElementById('li-pass');
  const rememberEl = document.getElementById('li-remember');
  const btn = document.getElementById('li-submit');
  const msg = document.getElementById('loginMsg');

  document.querySelectorAll('.lc-pw-toggle').forEach(t => t.addEventListener('click', () => {
    const inp = document.getElementById(t.dataset.target);
    const reveal = inp.type === 'password';
    inp.type = reveal ? 'text' : 'password';
    t.textContent = reveal ? 'Hide' : 'Show';
  }));

  function showMsg(text, ok) { msg.textContent = text; msg.className = 'lc-msg ' + (ok ? 'ok' : 'err'); }

  // Already signed in (and still remembered)? Go straight to the dashboard.
  // enforceRemember() first clears a non-remembered session on a cold load,
  // so we don't bounce login → dashboard → login.
  RA.enforceRemember()
    .then(() => RA.getSession())
    .then(s => { if (s) window.location.href = SITE_ROOT + 'dashboard/'; })
    .catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    const pass = passEl.value;
    if (!email || !pass) { showMsg('Please enter your email and password.'); return; }
    msg.textContent = ''; msg.className = 'lc-msg';
    btn.disabled = true; const orig = btn.textContent; btn.textContent = 'Logging in…';
    try {
      await RA.signIn(email, pass, rememberEl.checked);
      try { await RA.flushPending(); } catch (_) {}   // save onboarding data if it was pending
      window.location.href = SITE_ROOT + 'dashboard/';
    } catch (err) {
      btn.disabled = false; btn.textContent = orig;
      let m = (err && err.message) || 'Could not log in.';
      if (/email not confirmed/i.test(m)) m = 'Please verify your email first — check your inbox for the confirmation link.';
      else if (/invalid login credentials/i.test(m)) m = 'Incorrect email or password.';
      showMsg(m);
    }
  });
})();
</script>
</body>
</html>
