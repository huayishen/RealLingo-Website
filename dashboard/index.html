<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon.png">
<title>Your Dashboard — Real lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/quiz.css">
<style>
  html, body { position: static; height: auto; min-height: 100%; overflow-y: auto; }
  .dash-top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
              padding: 1rem 1.75rem; background: rgba(13,14,17,.82); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.06); }
  .dash-logo { font-size: 1.25rem; text-decoration: none; color: rgba(255,255,255,.7); display: flex; align-items: baseline; gap: .06em; }
  .dash-logo .lr { font-family: var(--sr); font-style: italic; }
  .dash-logo .ll { font-family: var(--ss); font-weight: 900; letter-spacing: -.03em; }
  .dash-top-right { display: flex; align-items: center; gap: .75rem; }
  .dash-hi { font-size: .84rem; color: rgba(255,255,255,.5); }
  .dash-hi b { color: var(--y); font-weight: 700; }
  .dash-btn { border: 1px solid rgba(255,255,255,.16); background: none; color: rgba(255,255,255,.75); border-radius: 100px;
              padding: .5rem 1.15rem; font-family: var(--ss); font-size: .8rem; font-weight: 600; cursor: pointer; transition: border-color .2s, color .2s, background .2s; text-decoration: none; display: inline-block; }
  .dash-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }
  .dash-btn-danger:hover { color: #ff8f8f; border-color: rgba(255,120,120,.5); }
  .dash-btn-solid { background: var(--y); color: #111216; border-color: var(--y); font-weight: 700; }
  .dash-btn-solid:hover { color: #111216; background: #fff; border-color: #fff; }

  .dash-wrap { position: relative; z-index: 10; max-width: 1080px; margin: 0 auto; padding: 2.25rem 1.5rem 5rem; }
  .dash-h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .3rem; }
  .dash-lead { color: rgba(255,255,255,.45); font-size: .9rem; margin-bottom: 2rem; }

  /* Compact profile summary card (clickable) */
  .dash-profile-card { display: flex; align-items: center; gap: 1.5rem; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
                       border-radius: 20px; padding: 1.5rem 1.75rem; cursor: pointer; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .dash-profile-card:hover { transform: translateY(-2px); border-color: rgba(255,235,153,.35); box-shadow: 0 18px 40px -22px rgba(0,0,0,.7); }
  .dash-ava { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,235,153,.3); background: #14151a; flex: 0 0 auto; }
  .dash-ava[data-default="1"] { object-fit: contain; padding: 12px; }
  .dash-profile-id { flex: 1; min-width: 0; }
  .dash-profile-name { font-size: 1.3rem; font-weight: 800; }
  .dash-profile-sub { color: var(--y); font-size: .85rem; font-weight: 600; margin-top: .1rem; }
  .dash-profile-meta { color: rgba(255,255,255,.45); font-size: .8rem; margin-top: .35rem; }
  .dash-profile-open { color: rgba(255,255,255,.4); font-size: 1.4rem; flex: 0 0 auto; transition: color .2s, transform .2s; }
  .dash-profile-card:hover .dash-profile-open { color: var(--y); transform: translateX(3px); }
  .dash-complete { margin-top: .9rem; }
  .dash-complete-top { display: flex; justify-content: space-between; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.4); margin-bottom: .35rem; }
  .dash-complete-track { height: 6px; border-radius: 100px; background: rgba(255,255,255,.08); overflow: hidden; }
  .dash-complete-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--ym), var(--y)); transition: width .6s ease; }

  .dash-section { margin-top: 2.75rem; }
  .dash-section-hd { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.1rem; }
  .dash-section-hd h2 { font-size: 1.15rem; font-weight: 800; white-space: nowrap; }
  .dash-section-hd::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.08); }

  .dash-empty { border: 1px dashed rgba(255,255,255,.14); border-radius: 14px; padding: 1.75rem; text-align: center; color: rgba(255,255,255,.4); font-size: .88rem; }

  /* Compact role cards */
  .dash-role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
  .dash-role-card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 1.25rem; cursor: pointer;
                    display: flex; flex-direction: column; gap: .5rem; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .dash-role-card:hover { transform: translateY(-3px); border-color: rgba(255,235,153,.4); box-shadow: 0 18px 40px -22px rgba(0,0,0,.7); }
  .dash-role-card-hd { display: flex; align-items: center; gap: .6rem; }
  .dash-role-icon { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,235,153,.08); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
  .dash-role-title { font-weight: 700; font-size: .98rem; }
  .dash-role-preview { color: rgba(255,255,255,.5); font-size: .8rem; line-height: 1.5; min-height: 2.4em; }
  .dash-role-cta { margin-top: auto; color: var(--y); font-size: .8rem; font-weight: 700; }

  .dash-app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
  .dash-app-card { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 1.1rem 1.25rem; }
  .dash-app-type { font-weight: 700; font-size: .92rem; text-transform: capitalize; }
  .dash-app-meta { font-size: .78rem; color: rgba(255,255,255,.45); margin-top: .25rem; }
  .dash-app-status { display: inline-block; margin-top: .6rem; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--y); background: rgba(255,235,153,.1); padding: .2rem .6rem; border-radius: 100px; }

  .dash-loading { text-align: center; padding: 5rem 1rem; color: rgba(255,255,255,.5); }

  /* ─── Slide-out drawer ─────────────────────────────────── */
  .drawer-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(6,7,9,.55); backdrop-filter: blur(3px);
                    opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; z-index: 61; height: 100%; width: 42%; max-width: 560px; min-width: 340px;
            background: #101116; border-left: 1px solid rgba(255,255,255,.08); box-shadow: -30px 0 80px -30px rgba(0,0,0,.8);
            border-top-left-radius: 22px; border-bottom-left-radius: 22px; display: flex; flex-direction: column;
            transform: translateX(105%); transition: transform .32s cubic-bezier(.4,0,.2,1); will-change: transform; }
  .drawer.open { transform: translateX(0); }
  .drawer-hd { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.5rem 1rem; border-bottom: 1px solid rgba(255,255,255,.06); }
  .drawer-close { background: rgba(255,255,255,.06); border: none; color: rgba(255,255,255,.7); width: 34px; height: 34px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; line-height: 1; transition: background .2s, color .2s; }
  .drawer-close:hover { background: rgba(255,255,255,.14); color: #fff; }
  .drawer-title { font-size: 1.05rem; font-weight: 800; flex: 1; }
  .drawer-nav { display: flex; gap: .5rem; overflow-x: auto; padding: .85rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,.06); scrollbar-width: none; }
  .drawer-nav::-webkit-scrollbar { display: none; }
  .drawer-pill { flex: 0 0 auto; padding: .45rem 1rem; border-radius: 100px; border: 1px solid rgba(255,255,255,.12); background: none;
                 color: rgba(255,255,255,.6); font-family: var(--ss); font-size: .8rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .2s; }
  .drawer-pill:hover { color: #fff; border-color: rgba(255,255,255,.3); }
  .drawer-pill.active { background: var(--y); color: #111216; border-color: var(--y); font-weight: 700; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 1.5rem; }
  .drawer-body.switching { opacity: 0; transform: translateX(12px); }
  .drawer-body { transition: opacity .2s ease, transform .2s ease; }
  .drawer-foot { padding: 1rem 1.5rem 1.25rem; border-top: 1px solid rgba(255,255,255,.06); display: flex; gap: .75rem; }
  .drawer-foot:empty { display: none; }

  .dw-ava-wrap { text-align: center; margin-bottom: 1.5rem; }
  .dw-ava { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,235,153,.3); background: #14151a; }
  .dw-ava[data-default="1"] { object-fit: contain; padding: 16px; }
  .dw-ava-actions { margin-top: .75rem; display: flex; gap: .5rem; justify-content: center; }
  .dw-name { text-align: center; font-size: 1.35rem; font-weight: 800; }
  .dw-uname { text-align: center; color: var(--y); font-weight: 600; font-size: .88rem; margin-top: .15rem; }
  .dw-email { text-align: center; color: rgba(255,255,255,.5); font-size: .82rem; margin-top: .1rem; word-break: break-all; }
  .dw-group { margin-top: 1.75rem; }
  .dw-group-hd { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.4); margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1px solid rgba(255,255,255,.06); }
  .dw-row { display: flex; justify-content: space-between; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid rgba(255,255,255,.04); }
  .dw-row-lbl { color: rgba(255,255,255,.45); font-size: .82rem; flex: 0 0 40%; }
  .dw-row-val { font-size: .88rem; text-align: right; }
  .dw-field { margin-bottom: .9rem; }
  .dw-field .fi, .dw-field .fs { margin-bottom: 0; }
  .dw-msg { font-size: .82rem; font-weight: 600; min-height: 1.05em; margin-bottom: .5rem; }
  .dw-msg.err { color: #ff8f8f; } .dw-msg.ok { color: #7bd88f; }
  .uname-status { font-size: .8rem; font-weight: 600; min-height: 1.05em; margin-top: .35rem; }
  .uname-status.ok { color: #7bd88f; } .uname-status.bad { color: #ff8f8f; }
  .dw-check { display: flex; align-items: center; gap: .5rem; font-size: .86rem; color: rgba(255,255,255,.75); margin-bottom: .7rem; cursor: pointer; }
  .dw-check input { width: 16px; height: 16px; accent-color: var(--y); }
  .dw-note { color: rgba(255,255,255,.4); font-size: .8rem; margin: .5rem 0 1rem; line-height: 1.5; }
  .drawer-foot .dash-btn { flex: 1; text-align: center; padding: .7rem; }

  @media (max-width: 1024px) { .drawer { width: 58%; } }
  @media (max-width: 680px) {
    .drawer { width: 100%; max-width: none; min-width: 0; border-radius: 0; }
    .dash-profile-card { flex-direction: column; text-align: center; }
    .dash-top-right .dash-hi { display: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain" aria-hidden="true"></div>

<header class="dash-top">
  <a class="dash-logo" href="../"><span class="lr">Real</span><span class="ll">lingo</span></a>
  <div class="dash-top-right">
    <span class="dash-hi" id="dashHi"></span>
    <a class="dash-btn" href="../explore/event/">Events</a>
    <button class="dash-btn dash-btn-danger" id="dashLogout">Log out</button>
  </div>
</header>

<main class="dash-wrap">
  <div id="dashLoading" class="dash-loading">Loading your dashboard…</div>
  <div id="dashContent" style="display:none;"></div>
  <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
</main>

<!-- Slide-out drawer -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="drawer-hd">
    <button class="drawer-close" id="drawerClose" aria-label="Close">&times;</button>
    <span class="drawer-title" id="drawerTitle">Details</span>
    <span id="drawerHdAction"></span>
  </div>
  <div class="drawer-nav" id="drawerNav"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<script> window.SITE_ROOT = "../"; </script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/quiz-data.js"></script>
<script>
(function () {
  const ROLE_META = {
    learner:{label:'Language Learner', icon:'🎓'}, traveler:{label:'Traveler', icon:'✈️'}, eventMember:{label:'Event Member', icon:'🎉'},
    tutor:{label:'Tutor', icon:'📚'}, translator:{label:'Translator / Interpreter', icon:'💬'}, influencer:{label:'Influencer', icon:'📣'},
    tourGuide:{label:'Tour Guide', icon:'🧭'}, languageEvent:{label:'Event Organizer', icon:'🌐'}, languageTalent:{label:'Language Talent', icon:'🌟'},
    hireTranslator:{label:'Hiring: Translator', icon:'💬'}, hireInfluencer:{label:'Hiring: Influencer', icon:'📣'},
    hireLanguageEvent:{label:'Hiring: Event Organizer', icon:'🌐'}, hireLanguageTalent:{label:'Hiring: Language Talent', icon:'🌟'}
  };
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const cap = s => s ? String(s).charAt(0).toUpperCase()+String(s).slice(1) : s;
  function formatLanguages(rows){
    if(!rows || !rows.length) return '—';
    const by = {}; rows.forEach(r => { (by[r.language] = by[r.language] || []).push(r); });
    return Object.entries(by).map(([lang, items]) =>
      (items.length === 1 && !items[0].variant) ? cap(lang)+' ('+cap(items[0].level)+')'
        : cap(lang)+' — '+items.map(i => i.variant ? cap(i.variant)+': '+cap(i.level) : cap(i.level)).join(', ')
    ).join('; ');
  }
  const memberSince = iso => { if(!iso) return '—'; try { return new Date(iso).toLocaleDateString(undefined,{month:'long',year:'numeric'}); } catch(e){ return '—'; } };
  function completion(p, languages, roles){
    const c = [!!(p&&p.full_name),!!(p&&p.username),!!(p&&p.email),!!(p&&p.country),!!(p&&p.city),!!(p&&p.phone),(languages&&languages.length>0),(roles&&roles.length>0),!!(p&&p.avatar_url)];
    return Math.round(c.filter(Boolean).length / c.length * 100);
  }
  function countryOptions(sel){
    const list = (typeof COUNTRIES !== 'undefined') ? COUNTRIES : [];
    return '<option value="">Select country…</option>' + list.map(c => '<option value="'+esc(c)+'"'+(sel===c?' selected':'')+'>'+esc(c)+'</option>').join('');
  }

  let DATA = null;
  let CURRENT = null;   // current drawer panel key
  let AVATAR_URL = null; // resolved public url (or default)

  // ─────────── Main dashboard ───────────
  async function render(data) {
    DATA = data;
    const p = data.profile;
    const loading = document.getElementById('dashLoading');
    const content = document.getElementById('dashContent');

    if (!p) {
      loading.style.display = 'none'; content.style.display = 'block';
      content.innerHTML = '<h1 class="dash-h1">Almost there</h1><p class="dash-lead">Your account is verified, but your profile isn\'t set up yet.</p>' +
        '<div class="dash-empty">Finish the onboarding quiz to build your profile. <a style="color:var(--y);font-weight:700" href="'+SITE_ROOT+'signup/">Start now →</a></div>';
      return;
    }

    document.getElementById('dashHi').innerHTML = 'Hi, <b>' + esc(p.username || 'there') + '</b>';
    AVATAR_URL = p.avatar_url ? await RA.avatarPublicUrl(p.avatar_url) : (SITE_ROOT + 'assets/img/logo-yellow.png');
    const isDefault = !p.avatar_url;
    const pct = completion(p, data.languages, data.roles);

    let html = '<h1 class="dash-h1">Your Dashboard</h1><p class="dash-lead">Click your profile or any role to view and edit the details.</p>';

    // Compact profile card
    html += '<div class="dash-profile-card" data-open="profile">' +
      '<img class="dash-ava" src="'+esc(AVATAR_URL)+'"'+(isDefault?' data-default="1"':'')+' alt="Avatar">' +
      '<div class="dash-profile-id">' +
        '<div class="dash-profile-name">'+esc(p.full_name || p.username || 'Your profile')+'</div>' +
        '<div class="dash-profile-sub">@'+esc(p.username||'')+'</div>' +
        '<div class="dash-profile-meta">'+esc([p.city,p.country].filter(Boolean).join(', ')||'')+(p.city||p.country?' · ':'')+esc(p.email||'')+'</div>' +
        '<div class="dash-complete"><div class="dash-complete-top"><span>Profile completion</span><span>'+pct+'%</span></div><div class="dash-complete-track"><div class="dash-complete-fill" style="width:'+pct+'%"></div></div></div>' +
      '</div>' +
      '<div class="dash-profile-open">›</div>' +
    '</div>';

    // Roles
    html += '<div class="dash-section"><div class="dash-section-hd"><h2>My Roles</h2></div>';
    if (!data.roles.length) html += '<div class="dash-empty">No roles selected yet. <a style="color:var(--y);font-weight:700" href="'+SITE_ROOT+'signup/'+esc(p.onboarding_flow||'all')+'/?edit=1">Add roles →</a></div>';
    else {
      html += '<div class="dash-role-grid">' + data.roles.map(rr => {
        const r = rr.role_key, meta = ROLE_META[r] || {label:r, icon:'⭐'};
        const detail = data.roleDetails[r];
        const rows = (detail && detail.details && detail.details.display_rows) || [];
        const preview = rows.slice(0,2).map(x => x.v).join(' · ') || 'No details yet';
        return '<div class="dash-role-card" data-open="'+esc(r)+'">' +
          '<div class="dash-role-card-hd"><span class="dash-role-icon">'+meta.icon+'</span><span class="dash-role-title">'+esc(meta.label)+'</span></div>' +
          '<div class="dash-role-preview">'+esc(preview)+'</div>' +
          '<div class="dash-role-cta">View details →</div>' +
        '</div>';
      }).join('') + '</div>';
    }
    html += '</div>';

    // Applications
    html += '<div class="dash-section"><div class="dash-section-hd"><h2>My Applications</h2></div>';
    if (!data.applications.length) html += '<div class="dash-empty">No applications yet. Scholarship, partner, and event applications will appear here.</div>';
    else html += '<div class="dash-app-grid">' + data.applications.map(a => '<div class="dash-app-card"><div class="dash-app-type">'+esc(a.type)+' application</div><div class="dash-app-meta">'+memberSince(a.created_at)+'</div><span class="dash-app-status">'+esc(a.status||'submitted')+'</span></div>').join('') + '</div>';
    html += '</div>';

    // Account section entry (opens drawer)
    html += '<div class="dash-section"><div class="dash-section-hd"><h2>Account</h2></div>' +
      '<div class="dash-role-grid">' +
        '<div class="dash-role-card" data-open="account"><div class="dash-role-card-hd"><span class="dash-role-icon">⚙️</span><span class="dash-role-title">Account settings</span></div><div class="dash-role-preview">Password · notification preferences</div><div class="dash-role-cta">Open →</div></div>' +
        '<div class="dash-role-card" onclick="window.open(\''+SITE_ROOT+'u/?u='+encodeURIComponent(p.username||'')+'\',\'_blank\')"><div class="dash-role-card-hd"><span class="dash-role-icon">🔗</span><span class="dash-role-title">Public profile</span></div><div class="dash-role-preview">See how others view your profile</div><div class="dash-role-cta">View public ↗</div></div>' +
      '</div></div>';

    loading.style.display = 'none';
    content.innerHTML = html;
    content.style.display = 'block';

    content.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openDrawer(el.dataset.open)));
  }

  // ─────────── Drawer ───────────
  const overlay = document.getElementById('drawerOverlay');
  const drawer = document.getElementById('drawer');
  const bodyEl = document.getElementById('drawerBody');
  const navEl = document.getElementById('drawerNav');
  const footEl = document.getElementById('drawerFoot');
  const titleEl = document.getElementById('drawerTitle');
  const hdActionEl = document.getElementById('drawerHdAction');

  function navItems() {
    const items = [{ key: 'profile', label: 'My Profile' }];
    (DATA.roles || []).forEach(rr => items.push({ key: rr.role_key, label: (ROLE_META[rr.role_key]||{}).label || rr.role_key }));
    items.push({ key: 'account', label: 'Account' });
    return items;
  }
  function renderNav() {
    navEl.innerHTML = navItems().map(it => '<button class="drawer-pill'+(it.key===CURRENT?' active':'')+'" data-nav="'+esc(it.key)+'">'+esc(it.label)+'</button>').join('');
    navEl.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => switchTo(b.dataset.nav)));
  }

  function openDrawer(key) {
    CURRENT = key;
    renderNav();
    paint('view');
    overlay.classList.add('open');
    drawer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer() {
    overlay.classList.remove('open');
    drawer.classList.remove('open');
    document.body.style.overflow = '';
  }
  function switchTo(key) {
    if (key === CURRENT) return;
    CURRENT = key;
    renderNav();
    // smooth content transition
    bodyEl.classList.add('switching');
    setTimeout(() => { paint('view'); bodyEl.classList.remove('switching'); }, 180);
  }

  // Render panel content for CURRENT in the given mode
  function paint(mode) {
    const p = DATA.profile;
    navEl.querySelectorAll('.drawer-pill').forEach(b => b.classList.toggle('active', b.dataset.nav === CURRENT));

    if (CURRENT === 'profile') { titleEl.textContent = 'My Profile'; mode === 'edit' ? paintProfileEdit() : paintProfileView(); return; }
    if (CURRENT === 'account') { titleEl.textContent = 'Account'; hdActionEl.innerHTML = ''; paintAccount(); return; }
    // role
    const meta = ROLE_META[CURRENT] || { label: CURRENT, icon: '⭐' };
    titleEl.textContent = meta.label;
    paintRoleView(CURRENT, meta);
  }

  function paintProfileView() {
    const p = DATA.profile;
    hdActionEl.innerHTML = '<button class="dash-btn" id="dwEditProfile">Edit</button>';
    let h = '<div class="dw-ava-wrap"><img class="dw-ava" src="'+esc(AVATAR_URL)+'"'+(p.avatar_url?'':' data-default="1"')+' alt="Avatar"></div>';
    h += '<div class="dw-name">'+esc(p.full_name||'—')+'</div><div class="dw-uname">@'+esc(p.username||'')+'</div><div class="dw-email">'+esc(p.email||'')+'</div>';
    h += '<div class="dw-group"><div class="dw-group-hd">General Information</div>' +
      row('Country', p.country) + row('City', p.city) + row('Languages', formatLanguages(DATA.languages)) +
      row('Phone', p.phone) + row('Member since', memberSince(p.created_at)) + '</div>';
    bodyEl.innerHTML = h;
    footEl.innerHTML = '';
    document.getElementById('dwEditProfile').addEventListener('click', () => paint('edit'));
  }
  function row(l, v){ return '<div class="dw-row"><span class="dw-row-lbl">'+esc(l)+'</span><span class="dw-row-val">'+esc(v||'—')+'</span></div>'; }

  function paintProfileEdit() {
    const p = DATA.profile;
    hdActionEl.innerHTML = '';
    let h = '<div class="dw-msg" id="dwMsg"></div>';
    h += '<div class="dw-ava-wrap"><img class="dw-ava" src="'+esc(AVATAR_URL)+'"'+(p.avatar_url?'':' data-default="1"')+' alt="Avatar">' +
      '<div class="dw-ava-actions"><button class="dash-btn" id="dwAvaUp">'+(p.avatar_url?'Replace':'Upload')+' photo</button>'+(p.avatar_url?'<button class="dash-btn dash-btn-danger" id="dwAvaRm">Remove</button>':'')+'</div></div>';
    h += '<div class="dw-field"><label class="fl-sm">Full name</label><input class="fi" id="e-name" value="'+esc(p.full_name||'')+'"></div>';
    h += '<div class="dw-field"><label class="fl-sm">Username</label><input class="fi" id="e-username" value="'+esc(p.username||'')+'" maxlength="20" autocomplete="off"><div class="uname-status" id="e-uname-status"></div></div>';
    h += '<div class="dw-field"><label class="fl-sm">Country</label><select class="fs" id="e-country">'+countryOptions(p.country||'')+'</select></div>';
    h += '<div class="dw-field"><label class="fl-sm">City</label><input class="fi" id="e-city" value="'+esc(p.city||'')+'"></div>';
    h += '<div class="dw-field"><label class="fl-sm">Phone</label><input class="fi" id="e-phone" value="'+esc(p.phone||'')+'" placeholder="+966 5xxxxxxxx"></div>';
    bodyEl.innerHTML = h;
    footEl.innerHTML = '<button class="dash-btn" id="dwCancel">Cancel</button><button class="dash-btn dash-btn-solid" id="dwSave">Save changes</button>';

    document.getElementById('dwCancel').addEventListener('click', () => paint('view'));
    document.getElementById('dwAvaUp').addEventListener('click', () => { window._avaTarget = 'drawer'; document.getElementById('avatarInput').click(); });
    const rm = document.getElementById('dwAvaRm'); if (rm) rm.addEventListener('click', doAvatarRemove);

    // live username availability
    const unmeInput = document.getElementById('e-username'); let t = null;
    unmeInput.addEventListener('input', () => {
      clearTimeout(t); const v = unmeInput.value.trim(); const s = document.getElementById('e-uname-status');
      if(!/^[a-zA-Z0-9_]{3,20}$/.test(v)){ s.textContent = v?'3–20 letters, numbers, underscores':''; s.className='uname-status bad'; return; }
      if(v.toLowerCase()===(p.username||'').toLowerCase()){ s.textContent=''; s.className='uname-status'; return; }
      s.textContent='Checking…'; s.className='uname-status';
      t=setTimeout(()=>RA.usernameAvailable(v).then(ok=>{ if(unmeInput.value.trim()!==v)return; s.textContent=ok?'✓ Available':'✕ Taken'; s.className='uname-status '+(ok?'ok':'bad'); }).catch(()=>{s.textContent='';}), 400);
    });

    document.getElementById('dwSave').addEventListener('click', saveProfileEdits);
  }

  async function saveProfileEdits() {
    const p = DATA.profile;
    const msg = document.getElementById('dwMsg');
    const setMsg = (t, ok) => { msg.textContent = t; msg.className = 'dw-msg ' + (ok?'ok':'err'); };
    const newUsername = document.getElementById('e-username').value.trim();
    const country = document.getElementById('e-country').value;
    const btn = document.getElementById('dwSave'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      if (newUsername.toLowerCase() !== (p.username||'').toLowerCase()) {
        if(!/^[a-zA-Z0-9_]{3,20}$/.test(newUsername)) throw new Error('Username must be 3–20 letters, numbers, or underscores.');
        await RA.updateUsername(newUsername);
      }
      await RA.updateBasics({
        full_name: document.getElementById('e-name').value.trim()||null,
        country: country||null, city: document.getElementById('e-city').value.trim()||null,
        phone: document.getElementById('e-phone').value.trim()||null,
        phone_country: country||null, phone_code: (typeof COUNTRY_DIAL_CODES!=='undefined'?COUNTRY_DIAL_CODES[country]:'')||null
      });
      await reloadData();
      paint('view');
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Save changes';
      setMsg(e.code==='username_taken' ? 'That username is already taken.' : (e.message||'Could not save.'));
    }
  }

  function paintRoleView(key, meta) {
    const detail = DATA.roleDetails[key];
    const rows = (detail && detail.details && detail.details.display_rows) || [];
    const flow = DATA.profile.onboarding_flow || 'all';
    hdActionEl.innerHTML = '';
    let h = '<div class="dw-ava-wrap"><div class="dash-role-icon" style="width:64px;height:64px;font-size:1.8rem;margin:0 auto">'+meta.icon+'</div></div>';
    h += '<div class="dw-name" style="font-size:1.15rem">'+esc(meta.label)+'</div>';
    h += '<div class="dw-group"><div class="dw-group-hd">Role details</div>' +
      (rows.length ? rows.map(x => row(x.l, x.v)).join('') : '<div class="dw-note">No details provided yet.</div>') + '</div>';
    h += '<div class="dw-note">Role fields use the full quiz editor (sliders, language & charge pickers) to keep everything consistent.</div>';
    bodyEl.innerHTML = h;
    footEl.innerHTML = '<a class="dash-btn dash-btn-solid" style="flex:1;text-align:center;padding:.7rem" href="'+SITE_ROOT+'signup/'+esc(flow)+'/?edit=1">Edit in full editor →</a>';
  }

  function paintAccount() {
    const p = DATA.profile; const np = p.notification_prefs || {};
    hdActionEl.innerHTML = '';
    let h = '<div class="dw-group"><div class="dw-group-hd">Change password</div>' +
      '<div class="dw-msg" id="dwPassMsg"></div>' +
      '<div class="dw-field"><label class="fl-sm">New password</label><input class="fi" id="a-pass" type="password" placeholder="At least 8 characters" autocomplete="new-password"></div>' +
      '<div class="dw-field"><label class="fl-sm">Confirm password</label><input class="fi" id="a-pass2" type="password" autocomplete="new-password"></div>' +
      '<button class="dash-btn dash-btn-solid" id="a-savePass">Update password</button></div>';
    h += '<div class="dw-group"><div class="dw-group-hd">Notification preferences</div>' +
      '<div class="dw-msg" id="dwNotifMsg"></div>' +
      '<label class="dw-check"><input type="checkbox" id="a-product"'+(np.product?' checked':'')+'> Product updates</label>' +
      '<label class="dw-check"><input type="checkbox" id="a-events"'+(np.events?' checked':'')+'> Event reminders</label>' +
      '<label class="dw-check"><input type="checkbox" id="a-tips"'+(np.tips?' checked':'')+'> Tips &amp; offers</label>' +
      '<button class="dash-btn dash-btn-solid" id="a-saveNotif">Save preferences</button></div>';
    bodyEl.innerHTML = h;
    footEl.innerHTML = '<button class="dash-btn dash-btn-danger" id="a-logout" style="flex:1;padding:.7rem">Log out</button>';

    document.getElementById('a-logout').addEventListener('click', doLogout);
    document.getElementById('a-savePass').addEventListener('click', async () => {
      const m = document.getElementById('dwPassMsg'); const set = (t,ok)=>{m.textContent=t;m.className='dw-msg '+(ok?'ok':'err');};
      const p1=document.getElementById('a-pass').value, p2=document.getElementById('a-pass2').value;
      if(p1.length<8) return set('Password must be at least 8 characters.');
      if(p1!==p2) return set('Passwords do not match.');
      try { await RA.updatePassword(p1); set('Password updated.', true); document.getElementById('a-pass').value=''; document.getElementById('a-pass2').value=''; }
      catch(e){ set(e.message||'Could not update password.'); }
    });
    document.getElementById('a-saveNotif').addEventListener('click', async () => {
      const m = document.getElementById('dwNotifMsg'); const set=(t,ok)=>{m.textContent=t;m.className='dw-msg '+(ok?'ok':'err');};
      try { await RA.updateNotificationPrefs({ product:document.getElementById('a-product').checked, events:document.getElementById('a-events').checked, tips:document.getElementById('a-tips').checked }); set('Preferences saved.', true); await reloadData(); }
      catch(e){ set(e.message||'Could not save.'); }
    });
  }

  async function reloadData() { DATA = await RA.loadProfile(); const pp = DATA.profile; AVATAR_URL = pp && pp.avatar_url ? await RA.avatarPublicUrl(pp.avatar_url) : (SITE_ROOT + 'assets/img/logo-yellow.png'); await render(DATA); }

  async function doAvatarRemove() {
    try { await RA.removeAvatar(); await reloadData(); openDrawer('profile'); paint('edit'); }
    catch(e){ alert('Could not remove photo: '+(e.message||e)); }
  }

  // ─────────── Global handlers ───────────
  function doLogout() { RA.signOut().catch(()=>{}).then(() => window.location.href = SITE_ROOT); }

  document.getElementById('dashLogout').addEventListener('click', doLogout);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  overlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer(); });

  // Avatar file input (shared)
  document.getElementById('avatarInput').onchange = async function () {
    const f = this.files && this.files[0]; if (!f) return;
    if (f.size > 2*1024*1024) { alert('Image must be under 2 MB.'); this.value=''; return; }
    try { await RA.uploadAvatar(f); await reloadData(); openDrawer('profile'); paint('edit'); }
    catch(e){ alert('Upload failed: '+(e.message||e)); }
    this.value = '';
  };

  // Swipe-to-close on touch devices
  let touchX = null;
  drawer.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  drawer.addEventListener('touchmove', e => {
    if (touchX === null) return;
    const dx = e.touches[0].clientX - touchX;
    if (dx > 0) drawer.style.transform = 'translateX(' + Math.min(dx, 400) + 'px)';
  }, { passive: true });
  drawer.addEventListener('touchend', e => {
    const dx = (e.changedTouches[0].clientX) - (touchX||0);
    drawer.style.transform = '';
    if (dx > 90) closeDrawer();
    touchX = null;
  });

  async function init() {
    const user = await RA.requireAuth(SITE_ROOT + 'login/');
    if (!user) return;
    try { await RA.flushPending(); } catch (e) { console.error('flushPending', e); }
    const data = await RA.loadProfile();
    await render(data || { profile: null, languages: [], roles: [], roleDetails: {}, applications: [] });
  }
  init().catch(err => { console.error(err); document.getElementById('dashLoading').textContent = 'Something went wrong loading your dashboard. Please reload.'; });
})();
</script>
</body>
</html>
