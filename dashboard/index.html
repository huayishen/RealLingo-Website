<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon.png">
<title>Your Account — Real lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css?v=19">
<link rel="stylesheet" href="../assets/css/account-drawer.css?v=19">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--cream); }
  .dash-landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 8rem 1.5rem 4rem; }
  .dash-landing-card { text-align: center; max-width: 420px; }
  .dash-landing-card h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .5rem; }
  .dash-landing-card p { color: var(--text-soft); font-size: .9rem; margin-bottom: 1.5rem; }
  .dash-open-btn { border: none; border-radius: 100px; background: var(--dark); color: var(--yellow); font-family: var(--font-sans); font-weight: 700; font-size: .9rem; padding: .85rem 1.75rem; cursor: pointer; transition: transform .15s; }
  .dash-open-btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="dash-landing">
  <div class="dash-landing-card">
    <h1>Your account</h1>
    <p>Manage your profile, roles, applications, and settings from the panel.</p>
    <button class="dash-open-btn" id="openPanelBtn">Open account panel</button>
  </div>
</main>

<div id="site-footer"></div>

<script>
  window.SITE_ROOT = "../";
  window.SITE_SECTION = null;
  window.SITE_PAGE = "dashboard";
</script>
<script src="../assets/js/nav.js?v=19" defer></script>
<script src="../assets/js/supabase-client.js?v=19"></script>
<script src="../assets/js/auth.js?v=19"></script>
<script src="../assets/js/account-drawer.js?v=19"></script>
<script>
  (function () {
    function openIt() { if (window.openAccountDrawer) window.openAccountDrawer(); }
    document.getElementById('openPanelBtn').addEventListener('click', openIt);
    // Auto-open on arrival (post-login / callback land here); open() gates auth.
    window.addEventListener('load', function () { setTimeout(openIt, 200); });
  })();
</script>
</body>
</html>
