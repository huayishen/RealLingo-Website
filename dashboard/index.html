<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon.png">
<title>Your Account — Real lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css?v=28">
<link rel="stylesheet" href="../assets/css/account-drawer.css?v=28">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: #f4f4f2; }
  .acct-loading { padding: 4rem 1rem; text-align: center; color: #8a8878; }
</style>
</head>
<body>

<div id="site-header"></div>

<!-- The account panel renders inline here (docked "page" mode), not as a popup. -->
<main class="acct-page" id="acctPageMount"></main>

<div id="site-footer"></div>

<script>
  window.SITE_ROOT = "../";
  window.SITE_SECTION = null;
  window.SITE_PAGE = "dashboard";
</script>
<script src="../assets/js/nav.js?v=28" defer></script>
<script src="../assets/js/supabase-client.js?v=28"></script>
<script src="../assets/js/auth.js?v=28"></script>
<script src="../assets/js/quiz-data.js?v=28"></script>
<script src="../assets/js/account-drawer.js?v=28"></script>
<script>
  (function () {
    function mount() {
      if (window.openAccountPage) window.openAccountPage(document.getElementById('acctPageMount'));
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(mount, 60);
    else window.addEventListener('DOMContentLoaded', mount);
  })();
</script>
</body>
</html>
