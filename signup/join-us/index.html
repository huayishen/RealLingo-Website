<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Us — Real lingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/quiz.css">
</head>
<body>

<!-- BG -->
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain" aria-hidden="true"></div>

<!-- ═══ FORM — multi-section questionnaire ═══════════════════ -->
<section class="screen off" id="s-form">

  <header class="app-hdr">
    <a href="../../" class="logo"><span class="lr">Real</span><span class="ll">lingo</span></a>
    <button class="skip-btn" onclick="goLanding()">skip →</button>
  </header>

  <div class="form-body">
    <nav class="sect-nav" id="sectNav" aria-label="Form sections"></nav>

    <div class="form-main">
      <div class="fp-bar">
        <div class="fp-meta">
          <span class="fp-step" id="fpStep">Step 1</span>
          <span class="fp-title" id="fpTitle"></span>
        </div>
        <div class="fp-track"><div class="fp-fill" id="fpFill" style="width:0%"></div></div>
      </div>

      <div class="fstep-area" id="fstepArea">
        <div class="fstep-inner" id="fstepInner"></div>
      </div>

      <div class="form-nav">
        <button class="fbn-back" id="fBtnBack" onclick="prevStep()">← Back</button>
        <button class="fbn-next" id="fBtnNext" onclick="nextStep()">Next →</button>
      </div>
    </div>
  </div>

</section>

<!-- ═══ WELCOME OVERLAY ════════════════════════════════════════ -->
<div id="s-welcome">
  <div class="wlc-card">
    <div class="wlc-en">Welcome to <strong>Real</strong>lingo!</div>
    <div class="wlc-zh">欢迎加入！</div>
    <div class="wlc-ar">أهلاً وسهلاً بك!</div>
    <div class="wlc-kr">환영합니다!</div>
    <div class="wlc-note">Taking you to the platform...</div>
    <div class="wlc-bar"></div>
    <button class="wlc-skip" onclick="skipWelcome()">Skip →</button>
  </div>
</div>

<script src="../../assets/js/quiz-data.js"></script>
<script src="../../assets/js/quiz-engine.js"></script>
<script>
window.SITE_ROOT = "../../";
const QUIZ_FLOW = 'join-us';

const ROLE_KEYS = SERVICE_ROLES.map(r=>r.key);
const ROLE_DISPLAY = Object.fromEntries(SERVICE_ROLES.map(r=>[r.key, r.as]));
const SECTION_LABEL = {
  general:        'General',
  tutor:          'Tutor',
  translator:     'Translator',
  influencer:     'Influencer',
  tourGuide:      'Tour Guide',
  languageEvent:  'Language Event',
  languageTalent: 'Language Talent',
  final:          'Final',
  review:         'Review',
};

const _preset = getPresetSel();
if (_preset) _preset.forEach(r => selectedRoles.add(r));
const _hasPreset = _preset && ROLE_KEYS.some(r => selectedRoles.has(r));

const generalSteps = [
  {
    tag:'General', q:"How should we call you?",
    html() { return `<input type="text" class="fi" id="inp-name" placeholder="Your full name" value="${esc(formData.name||'')}" autocomplete="name">`; },
    validate() { return document.getElementById('inp-name')?.value?.trim() ? null : 'Please enter your name'; },
    save() { formData.name = document.getElementById('inp-name')?.value?.trim()||''; }
  },
  {
    tag:'General', q:"My language level...", hint:"Select language(s) and proficiency",
    html() { return buildLangLevelHtml(); },
    validate() {
      const langs = formData.languages||{};
      if (!Object.keys(langs).length) return 'Please select at least one language';
      for (const [lk,lv] of Object.entries(langs)) {
        const def = LANGUAGES.find(l=>l.key===lk);
        if (!def) continue;
        if (def.variants.length===0) { if (!lv) return `Please select your level for ${def.label}`; }
        else {
          if (!lv||typeof lv!=='object'||!Object.keys(lv).length) return `Please select a variant for ${def.label}`;
          for (const [,vl] of Object.entries(lv)) { if (!vl) return `Please select a level for each ${def.label} variant`; }
        }
      }
      return null;
    },
    save() { /* formData.languages updated live */ }
  },
  {
    tag:'General', q:"I'm currently based in...",
    html() {
      return `
        <div style="margin-bottom:1rem">
          <label class="fl-sm">Country</label>
          ${countrySelectHtml('inp-country', formData.country||'')}
        </div>
        <div>
          <label class="fl-sm">City</label>
          <input type="text" class="fi" id="inp-city" placeholder="Your city" value="${esc(formData.city||'')}">
        </div>`;
    },
    validate() { return document.getElementById('inp-country')?.value ? null : 'Please select your country'; },
    save() { formData.country=document.getElementById('inp-country')?.value||''; formData.city=document.getElementById('inp-city')?.value?.trim()||''; }
  },
  {
    tag:'General', q:"I have professional qualifications...", hint:"Select all that apply",
    html() {
      const q = formData.qualifications||{};
      return `
        <div class="chk-grp col" id="qualGrp">
          <button type="button" class="c-opt${q.hasCertificate?' sel':''}" data-val="hasCertificate" onclick="toggleQual(this)">Certificate</button>
          <button type="button" class="c-opt${q.hasEducation?' sel':''}" data-val="hasEducation" onclick="toggleQual(this)">Education</button>
          <button type="button" class="c-opt${q.noQualification?' sel':''}" data-val="noQualification" onclick="toggleQual(this)">No professional qualification</button>
        </div>
        <div class="cond${q.hasCertificate?' show':''}" id="certQualRev">
          <label class="fl-sm">Certificate name</label>
          <input type="text" class="fi" id="inp-cert-name" placeholder="e.g. HSK Level 6" value="${esc(q.certName||'')}" style="margin-bottom:.75rem">
          <label class="fl-sm">Score (optional)</label>
          <input type="text" class="fi" id="inp-cert-score" placeholder="e.g. 300/300" value="${esc(q.certScore||'')}">
        </div>
        <div class="cond${q.hasEducation?' show':''}" id="eduQualRev" style="margin-top:.75rem">
          <label style="display:flex;align-items:center;gap:.75rem;cursor:pointer;margin-bottom:.875rem">
            <input type="checkbox" id="inp-enrolled" style="accent-color:var(--y);width:1rem;height:1rem" ${q.enrolled?'checked':''}>
            <span style="font-size:.875rem;color:rgba(255,255,255,.6)">Currently enrolled</span>
          </label>
          <div class="fg-2">
            <div>
              <label class="fl-sm">University</label>
              <input type="text" class="fi" id="inp-university" placeholder="University name" value="${esc(q.university||'')}">
            </div>
            <div>
              <label class="fl-sm">Department / Field</label>
              <input type="text" class="fi" id="inp-department" placeholder="e.g. Chinese Studies" value="${esc(q.department||'')}">
            </div>
          </div>
        </div>`;
    },
    validate() {
      const q = formData.qualifications||{};
      if (!q.hasCertificate&&!q.hasEducation&&!q.noQualification) return 'Please select at least one option';
      if (q.hasCertificate&&!document.getElementById('inp-cert-name')?.value?.trim()) return 'Please enter the certificate name';
      return null;
    },
    save() {
      if (!formData.qualifications) formData.qualifications={};
      const q=formData.qualifications;
      if(q.hasCertificate){q.certName=document.getElementById('inp-cert-name')?.value?.trim()||'';q.certScore=document.getElementById('inp-cert-score')?.value?.trim()||'';}
      if(q.hasEducation){q.enrolled=document.getElementById('inp-enrolled')?.checked??false;q.university=document.getElementById('inp-university')?.value?.trim()||'';q.department=document.getElementById('inp-department')?.value?.trim()||'';}
    }
  },
];
if (!_hasPreset) {
  generalSteps.splice(1, 0, {
    tag:'General', q:"I am...", hint:"Select all that apply",
    html() {
      return `<div class="chk-grp role-cards" id="rolesGrp">${
        ROLE_KEYS.map(k=>`<button type="button" class="c-opt${selectedRoles.has(k)?' sel':''}" data-val="${k}" onclick="toggleRole(this)">${esc(ROLE_DISPLAY[k])}</button>`).join('')
      }</div>`;
    },
    validate() { return selectedRoles.size>0 ? null : 'Please select at least one role'; },
    save() { invalidateSections(); }
  });
}

const ALL_SECTION_STEPS = {
  general: generalSteps,

  /* ── Tutor (4 questions) ── */
  tutor: [
    {
      tag:'Tutor', q:"I teach...",
      html() { return checkboxGroupHtml('tutorLangGrp',[{v:'arabic',t:'Arabic'},{v:'chinese',t:'Chinese'},{v:'korean',t:'Korean'},{v:'french',t:'French'},{v:'spanish',t:'Spanish'}],formData.tutorLanguages||[]); },
      validate() { return document.querySelectorAll('#tutorLangGrp .c-opt.sel').length>0?null:'Please select at least one language'; },
      save() { formData.tutorLanguages=Array.from(document.querySelectorAll('#tutorLangGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
    {
      tag:'Tutor', q:"I teach students at...", hint:"Select all that apply",
      html() { return checkboxGroupHtml('tutorLevelGrp',[{v:'beginner',t:'Beginner'},{v:'intermediate',t:'Intermediate'},{v:'advanced',t:'Advanced'}],formData.tutorStudentLevels||[]); },
      validate() { return document.querySelectorAll('#tutorLevelGrp .c-opt.sel').length>0?null:'Please select at least one level'; },
      save() { formData.tutorStudentLevels=Array.from(document.querySelectorAll('#tutorLevelGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
    {
      tag:'Tutor', q:"I teach through...",
      html() { return radioGroupHtml('tutorModeGrp',[{v:'online',t:'Online'},{v:'offline',t:'Offline'},{v:'both',t:'Both'}],formData.tutorMode||''); },
      validate() { return document.querySelector('#tutorModeGrp .r-opt.sel')?null:'Please select one option'; },
      save() { formData.tutorMode=document.querySelector('#tutorModeGrp .r-opt.sel')?.dataset.val||''; }
    },
    {
      tag:'Tutor', q:"I charge...",
      html() {
        return `
          ${checkboxGroupHtml('tutorChargeGrp',[{v:'hourly',t:'Hourly'},{v:'freetrial',t:'Free Trial'}],formData.tutorChargeTypes||[])}
          <div style="margin-top:1.25rem">
            <label class="fl-sm">Currency</label>
            ${currencyHtml('tutorCur',formData.tutorCurrency||'SAR')}
          </div>
          <label class="fl-sm" style="margin-top:1rem;display:block">Rate Range (per hour)</label>
          ${sliderHtml('tutorSlider',0,1000,formData.tutorRateMin??0,formData.tutorRateMax??200)}`;
      },
      validate() { return null; },
      save() {
        formData.tutorChargeTypes=Array.from(document.querySelectorAll('#tutorChargeGrp .c-opt.sel')).map(e=>e.dataset.val);
        formData.tutorCurrency=document.getElementById('tutorCur')?.value||'SAR';
      },
      postRender() { initSlider('tutorSlider',0,1000,10,'tutorRateMin','tutorRateMax','tutorCur'); }
    },
  ],

  /* ── Translator (5 questions) ── */
  translator: [
    {
      tag:'Translator', q:"I translate between...", hint:"Maximum two language pairs",
      html() {
        if(!formData.langPairs||!formData.langPairs.length) formData.langPairs=[{from:'',to:''}];
        return `<div id="langPairsWrap"></div>`;
      },
      validate() {
        const pairs=formData.langPairs||[];
        if(!pairs.length||!pairs[0].from||!pairs[0].to) return 'Please fill in at least one language pair';
        for(const p of pairs){if(p.from&&p.to&&p.from===p.to)return 'From and To languages must be different';}
        return null;
      },
      save() {
        if(!formData.langPairs) formData.langPairs=[];
        formData.langPairs.forEach((_,i)=>{
          const f=document.getElementById(`pair-from-${i}`);
          const t=document.getElementById(`pair-to-${i}`);
          if(f)formData.langPairs[i].from=f.value;
          if(t)formData.langPairs[i].to=t.value;
        });
        formData.langPairs=formData.langPairs.filter(p=>p.from||p.to);
      },
      postRender() { renderLangPairs(); }
    },
    {
      tag:'Translator', q:"I specialize in...", hint:"Select all that apply",
      html() {
        const opts=[{v:'legal',t:'Legal'},{v:'medical',t:'Medical'},{v:'business',t:'Business'},{v:'marketing',t:'Marketing'},{v:'technical',t:'Technical'},{v:'finance',t:'Finance'},{v:'education',t:'Education'},{v:'gaming',t:'Gaming'},{v:'general',t:'General'}];
        return checkboxGroupHtml('transSpecGrp',opts,formData.transSpecializations||[]);
      },
      validate() { return document.querySelectorAll('#transSpecGrp .c-opt.sel').length>0?null:'Please select at least one specialization'; },
      save() { formData.transSpecializations=Array.from(document.querySelectorAll('#transSpecGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
    {
      tag:'Translator', q:"I'm available for...", hint:"Select all that apply",
      html() {
        const opts=[{v:'freelance',t:'Freelance'},{v:'fulltime',t:'Full-time'},{v:'parttime',t:'Part-time'},{v:'project',t:'Project-based'}];
        return checkboxGroupHtml('transAvailGrp',opts,formData.transAvailability||[]);
      },
      validate() { return document.querySelectorAll('#transAvailGrp .c-opt.sel').length>0?null:'Please select at least one option'; },
      save() { formData.transAvailability=Array.from(document.querySelectorAll('#transAvailGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
    {
      tag:'Translator', q:"I provide...", hint:"Select all that apply",
      html() {
        const opts=[{v:'translation',t:'Translation'},{v:'interpretation',t:'Interpretation'},{v:'localization',t:'Localization'},{v:'transcription',t:'Transcription / Subtitling / Proofreading'}];
        return checkboxGroupHtml('transPrvdGrp',opts,formData.transProvides||[]);
      },
      validate() { return document.querySelectorAll('#transPrvdGrp .c-opt.sel').length>0?null:'Please select at least one service'; },
      save() { formData.transProvides=Array.from(document.querySelectorAll('#transPrvdGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
    {
      tag:'Translator', q:"I charge...",
      html() {
        const opts=[{v:'hourly',t:'Hourly'},{v:'daily',t:'Daily'},{v:'project',t:'Per Project'}];
        return `
          ${checkboxGroupHtml('transChargeGrp',opts,formData.transChargeTypes||[])}
          <div style="margin-top:1.25rem">
            <label class="fl-sm">Currency</label>
            ${currencyHtml('transCur',formData.transCurrency||'SAR')}
          </div>
          <label class="fl-sm" style="margin-top:1rem;display:block">Rate Range</label>
          ${sliderHtml('transSlider',0,10000,formData.transRateMin??0,formData.transRateMax??2000)}`;
      },
      validate() { return null; },
      save() {
        formData.transChargeTypes=Array.from(document.querySelectorAll('#transChargeGrp .c-opt.sel')).map(e=>e.dataset.val);
        formData.transCurrency=document.getElementById('transCur')?.value||'SAR';
      },
      postRender() { initSlider('transSlider',0,10000,100,'transRateMin','transRateMax','transCur'); }
    },
  ],

  /* ── Influencer (3 questions) ── */
  influencer: [
    {
      tag:'Influencer', q:"I create content on...", hint:"Select all platforms",
      html() {
        if(!formData.platforms)formData.platforms={};
        return `
          <div class="chk-grp" id="platformGrp">
            ${PLATFORMS.map(p=>`<button type="button" class="c-opt${p.key in formData.platforms?' sel':''}" data-val="${p.key}" onclick="togglePlatform(this)">${esc(p.label)}</button>`).join('')}
          </div>
          <div class="cond" id="platformHandles"></div>`;
      },
      validate() { return Object.keys(formData.platforms||{}).length>0?null:'Please select at least one platform'; },
      save() {
        PLATFORMS.forEach(p=>{
          const el=document.getElementById(`plh-${p.key}`);
          if(el&&p.key in (formData.platforms||{})) formData.platforms[p.key]=el.value;
        });
      },
      postRender() { renderPlatformHandles(); }
    },
    {
      tag:'Influencer', q:"I'm open to...", hint:"Select all that apply",
      html() {
        const opts=[{v:'sponsored',t:'Create sponsored videos'},{v:'mention',t:'Be paid for brand mentioning'},{v:'analytics',t:'Share my account analytics'}];
        return checkboxGroupHtml('inflOpenGrp',opts,formData.inflOpenTo||[],'col');
      },
      validate() { return document.querySelectorAll('#inflOpenGrp .c-opt.sel').length>0?null:'Please select at least one option'; },
      save() { formData.inflOpenTo=Array.from(document.querySelectorAll('#inflOpenGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
    {
      tag:'Influencer', q:"My experience in paid collaboration...",
      html() {
        const opts=[{v:'none',t:'None'},{v:'0-1yr',t:'0–1 years'},{v:'1-3yr',t:'1–3 years'},{v:'3plus',t:'3+ years'}];
        return radioGroupHtml('inflExpGrp',opts,formData.inflExperience||'');
      },
      validate() { return document.querySelector('#inflExpGrp .r-opt.sel')?null:'Please select one option'; },
      save() { formData.inflExperience=document.querySelector('#inflExpGrp .r-opt.sel')?.dataset.val||''; }
    },
  ],

  /* ── Tour Guide (2 questions) ── */
  tourGuide: [
    {
      tag:'Tour Guide', q:"I work in...", hint:"Hold Ctrl / Cmd to select multiple countries",
      html() { return multiCountryHtml('inp-tourCountries',formData.tourCountries||[]); },
      validate() {
        const sel=Array.from(document.getElementById('inp-tourCountries')?.selectedOptions||[]).map(o=>o.value);
        return sel.length>0?null:'Please select at least one country';
      },
      save() { formData.tourCountries=Array.from(document.getElementById('inp-tourCountries')?.selectedOptions||[]).map(o=>o.value); }
    },
    {
      tag:'Tour Guide', q:"I charge...",
      html() {
        const saved=formData.tourChargeTypes||[];
        const period=formData.tourPeriodSpec||'';
        return `
          <div class="chk-grp" id="tourChargeGrp">
            ${[{v:'hourly',t:'Hourly'},{v:'daily',t:'Daily'}].map(o=>`<button type="button" class="c-opt${saved.includes(o.v)?' sel':''}" data-val="${o.v}" onclick="toggleChk(this)">${o.t}</button>`).join('')}
            <button type="button" class="c-opt${saved.includes('period')?' sel':''}" data-val="period" onclick="toggleChkOther(this,'tourPeriodRev')">Per Period of Time</button>
          </div>
          <div class="cond${saved.includes('period')?' show':''}" id="tourPeriodRev">
            <input type="text" class="fi" id="inp-tourPeriod" placeholder="e.g. per tour, half-day package" value="${esc(period)}">
          </div>
          <div style="margin-top:1.25rem">
            <label class="fl-sm">Currency</label>
            ${currencyHtml('tourCur',formData.tourCurrency||'SAR')}
          </div>
          <label class="fl-sm" style="margin-top:1rem;display:block">Rate Range</label>
          ${sliderHtml('tourSlider',0,10000,formData.tourRateMin??0,formData.tourRateMax??1000)}`;
      },
      validate() { return null; },
      save() {
        formData.tourChargeTypes=Array.from(document.querySelectorAll('#tourChargeGrp .c-opt.sel')).map(e=>e.dataset.val);
        formData.tourPeriodSpec=document.getElementById('inp-tourPeriod')?.value?.trim()||'';
        formData.tourCurrency=document.getElementById('tourCur')?.value||'SAR';
      },
      postRender() { initSlider('tourSlider',0,10000,100,'tourRateMin','tourRateMax','tourCur'); }
    },
  ],

  /* ── Language Event / Community Leader (2 questions) ── */
  languageEvent: [
    {
      tag:'Language Event', q:"My community / event is mostly based in...",
      html() { return countrySelectHtml('inp-eventCountry',formData.eventCountry||''); },
      validate() { return document.getElementById('inp-eventCountry')?.value?null:'Please select a country'; },
      save() { formData.eventCountry=document.getElementById('inp-eventCountry')?.value||''; }
    },
    {
      tag:'Language Event', q:"My language community speaks...", hint:"Select all that apply",
      html() {
        const opts=[{v:'arabic',t:'Arabic'},{v:'chinese',t:'Chinese'},{v:'korean',t:'Korean'},{v:'french',t:'French'},{v:'spanish',t:'Spanish'}];
        return checkboxGroupHtml('eventLangGrp',opts,formData.eventLanguages||[]);
      },
      validate() { return document.querySelectorAll('#eventLangGrp .c-opt.sel').length>0?null:'Please select at least one language'; },
      save() { formData.eventLanguages=Array.from(document.querySelectorAll('#eventLangGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
  ],

  /* ── Language Talent (2 questions) ── */
  languageTalent: [
    {
      tag:'Language Talent', q:"I'm interested in...", hint:"Select all that apply",
      html() {
        const saved=formData.talentIndustries||[];
        return `<div class="chk-grp" id="talentIndGrp">${
          INDUSTRIES.map(ind=>`<button type="button" class="c-opt${saved.includes(ind)?' sel':''}" data-val="${ind}" onclick="toggleChk(this)">${esc(ind)}</button>`).join('')
        }</div>`;
      },
      validate() { return document.querySelectorAll('#talentIndGrp .c-opt.sel').length>0?null:'Please select at least one industry'; },
      save() { formData.talentIndustries=Array.from(document.querySelectorAll('#talentIndGrp .c-opt.sel')).map(e=>e.dataset.val); }
    },
    {
      tag:'Language Talent', q:"My expected salary...",
      html() {
        return `
          <div style="margin-bottom:1rem">
            <label class="fl-sm">Currency</label>
            ${currencyHtml('talentCur',formData.talentCurrency||'SAR')}
          </div>
          <label class="fl-sm" style="display:block">Monthly Salary Range</label>
          ${sliderHtml('talentSlider',0,10000,formData.talentSalMin??0,formData.talentSalMax??3000)}`;
      },
      validate() { return null; },
      save() { formData.talentCurrency=document.getElementById('talentCur')?.value||'SAR'; },
      postRender() { initSlider('talentSlider',0,10000,100,'talentSalMin','talentSalMax','talentCur'); }
    },
  ],

  /* ── Final (contact only) ── */
  final: [
    {
      tag:'Almost done!', q:"How can we contact you?", hint:"At least one contact method required",
      html() {
        return `
          <div style="margin-bottom:1rem">
            <label class="fl-sm">Email address</label>
            <input type="email" class="fi" id="inp-email" placeholder="you@example.com" value="${esc(formData.email||'')}" autocomplete="email">
          </div>
          <div>
            <label class="fl-sm">Phone number</label>
            <input type="tel" class="fi" id="inp-phone" placeholder="+1 234 567 8900" value="${esc(formData.phone||'')}" autocomplete="tel">
          </div>`;
      },
      validate() {
        const email=document.getElementById('inp-email')?.value?.trim();
        const phone=document.getElementById('inp-phone')?.value?.trim();
        if(!email&&!phone) return 'Please provide at least one contact method';
        if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Please enter a valid email address';
        return null;
      },
      save() {
        formData.email=document.getElementById('inp-email')?.value?.trim()||'';
        formData.phone=document.getElementById('inp-phone')?.value?.trim()||'';
      }
    },
  ],
};

showForm();
</script>
</body>
</html>
