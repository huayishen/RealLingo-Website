<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../../assets/img/favicon.png">
  <title>Sign Up — RealLingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/quiz.css?v=34">
</head>
<body>

<!-- BG -->
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain" aria-hidden="true"></div>

<!-- ═══ INTRO ══════════════════════════════════════════════════ -->
<section class="screen" id="s-intro">
  <header class="app-hdr">
    <a href="../../" class="logo"><span class="lr">Real</span><span class="ll">lingo</span></a>
    <button class="skip-btn" onclick="goLanding()">skip →</button>
  </header>
  <div class="sticker s-zh">中文</div>
  <div class="sticker s-ar">عربي</div>
  <div class="sticker s-kr">한국어</div>
  <div class="intro-body">
    <h1 class="intro-h1" id="introH1"><span class="intro-over" id="introLine1">Beyond Words</span><span id="introLine2">Into Worlds</span></h1>
    <button class="btn-start" onclick="showForm()">start quiz</button>
  </div>
</section>

<!-- ═══ FORM — multi-section questionnaire ═══════════════════ -->
<section class="screen off" id="s-form">

  <header class="app-hdr">
    <a href="../../" class="logo"><span class="lr">Real</span><span class="ll">lingo</span></a>
    <button class="skip-btn" onclick="goLanding()">skip →</button>
  </header>

  <div class="form-body">
    <!-- Left sidebar: section progress -->
    <nav class="sect-nav" id="sectNav" aria-label="Form sections"></nav>

    <!-- Main content -->
    <div class="form-main">
      <!-- Progress bar -->
      <div class="fp-bar">
        <div class="fp-meta">
          <span class="fp-step" id="fpStep">Step 1</span>
          <span class="fp-title" id="fpTitle"></span>
        </div>
        <div class="fp-track"><div class="fp-fill" id="fpFill" style="width:0%"></div></div>
      </div>

      <!-- Scrollable step area -->
      <div class="fstep-area" id="fstepArea">
        <div class="fstep-inner" id="fstepInner"></div>
      </div>

      <!-- Navigation -->
      <div class="form-nav">
        <button class="fbn-back" id="fBtnBack" onclick="prevStep()">← Back</button>
        <button class="fbn-next" id="fBtnNext" onclick="nextStep()">Next →</button>
      </div>
    </div>
  </div>

</section>

<!-- ═══ WELCOME OVERLAY ════════════════════════════════════════ -->
<div id="s-welcome">
  <div class="wlc-card">
    <div class="wlc-en">Welcome to <strong>Real</strong>lingo!</div>
    <div class="wlc-zh">欢迎加入！</div>
    <div class="wlc-ar">أهلاً وسهلاً بك!</div>
    <div class="wlc-kr">환영합니다!</div>
    <div class="wlc-note">Taking you to the platform...</div>
    <div class="wlc-bar"></div>
    <button class="wlc-skip" onclick="skipWelcome()">Skip →</button>
  </div>
</div>

<script src="../../assets/js/supabase-client.js?v=34"></script>
<script src="../../assets/js/auth.js?v=34"></script>
<script src="../../assets/js/quiz-data.js?v=34"></script>
<script src="../../assets/js/quiz-engine.js?v=34"></script>
<script>
window.SITE_ROOT = "../../";
const QUIZ_FLOW = 'user';

/* ─── Single, event-user-focused signup flow ───────────────────────────
   No roles, no branching — every visitor answers the same short set of
   profile questions, then Create Account. (The old role-based flows are
   retired; all signup entry points now land here.)

   A "Skip for now" link (engine-provided) lets a visitor create their
   account after just their name and finish the rest later from the
   dashboard. When they come back to finish (dashboard → "Complete your
   profile", which runs in completion mode), only the questions they
   HAVEN'T answered yet are shown — see onlyIfEmpty() / each step's skip().
   An explicit "Edit" (?edit=1) shows everything so any answer can change. */

const ROLE_KEYS = [];
const ROLE_DISPLAY = {};
const SECTION_LABEL = { general:'General', review:'Review' };

// Every signup is stored as a "language learner" so the learning answers
// (I'm learning / learning for / looking for) persist through the existing
// profile machinery and round-trip on a later "complete your profile" visit.
// ROLE_KEYS is empty, so this adds NO extra section or review card — it's just
// the storage bucket for those answers. (In completion/edit mode the engine
// reloads the real role set from the saved profile, preserving any legacy roles.)
if (typeof selectedRoles !== 'undefined') selectedRoles.add('learner');

// True only while "completing" an existing profile (logged in, not ?edit=1)
// AND the value is already filled — used by each step's skip() so finishing
// later never re-asks an answered question. Fresh signups and explicit edits
// both show every question.
function onlyIfEmpty(v){ return COMPLETION_MODE && !EDIT_MODE && !!v; }

/* ── "I'm learning..." — the five headline languages plus an "Other" picker
   that adds any world language from a dropdown. Other languages are stored in
   formData.learnerLanguages by their label (e.g. "Japanese") so they persist
   through the learner details and read cleanly on the review/dashboard. ── */
const KNOWN_LEARN = ['arabic','chinese','korean','spanish','french'];
function learnOtherList(){ return (formData.learnerLanguages||[]).filter(x=>!KNOWN_LEARN.includes(x)); }
function learnLangInner(){
  const sel = formData.learnerLanguages||[];
  const others = learnOtherList();
  const otherActive = !!formData._learnOtherOpen || others.length>0;
  const chosen = new Set(others);
  const avail = (typeof WORLD_LANGUAGES!=='undefined'?WORLD_LANGUAGES:[]).filter(w=>!chosen.has(w.label));
  const five = [{v:'arabic',t:'Arabic'},{v:'chinese',t:'Chinese'},{v:'korean',t:'Korean'},{v:'spanish',t:'Spanish'},{v:'french',t:'French'}];
  return `
    <div class="chk-grp" id="learnerLangGrp">
      ${five.map(o=>`<button type="button" class="c-opt${sel.includes(o.v)?' sel':''}" data-val="${o.v}" onclick="learnToggle('${o.v}')">${o.t}</button>`).join('')}
      <button type="button" class="c-opt${otherActive?' sel':''}" onclick="learnOtherToggle()">Other</button>
    </div>
    ${otherActive ? `
      <div class="cond show" style="margin-top:.85rem">
        ${others.length ? `<div class="chk-grp" style="margin-bottom:.6rem">${others.map(o=>`<button type="button" class="c-opt sel" title="Remove" onclick="learnRemoveOther('${o.replace(/'/g,"\\'")}')">${esc(o)} ✕</button>`).join('')}</div>` : ''}
        <select class="fs" id="learnOtherAdd" onchange="learnAddOther(this.value); this.value='';">
          <option value="">+ Add a language…</option>
          ${avail.map(w=>`<option value="${esc(w.label)}">${esc(w.label)}</option>`).join('')}
        </select>
      </div>` : ''}`;
}
function learnLangHtml(){ return `<div id="learnWrap">${learnLangInner()}</div>`; }
function rerenderLearn(){ const w=document.getElementById('learnWrap'); if(w) w.innerHTML = learnLangInner(); }
function learnToggle(v){
  if(!formData.learnerLanguages) formData.learnerLanguages=[];
  const i=formData.learnerLanguages.indexOf(v);
  if(i>=0) formData.learnerLanguages.splice(i,1); else formData.learnerLanguages.push(v);
  rerenderLearn();
}
function learnOtherToggle(){
  const active = !!formData._learnOtherOpen || learnOtherList().length>0;
  if(active){ formData._learnOtherOpen=false; formData.learnerLanguages=(formData.learnerLanguages||[]).filter(x=>KNOWN_LEARN.includes(x)); }
  else { formData._learnOtherOpen=true; }
  rerenderLearn();
}
function learnAddOther(label){
  if(!label) return;
  if(!formData.learnerLanguages) formData.learnerLanguages=[];
  if(!formData.learnerLanguages.includes(label)) formData.learnerLanguages.push(label);
  formData._learnOtherOpen=true;
  rerenderLearn();
}
function learnRemoveOther(label){
  formData.learnerLanguages=(formData.learnerLanguages||[]).filter(x=>x!==label);
  rerenderLearn();
}

const generalSteps = [
  {
    tag:'General', q:"How should we call you?",
    skip(){ return onlyIfEmpty(formData.name && formData.name.trim()); },
    html() { return `<input type="text" class="fi" id="inp-name" placeholder="Your preferred name" value="${esc(formData.name||'')}" autocomplete="name">`; },
    validate() { return document.getElementById('inp-name')?.value?.trim() ? null : 'Please enter your name'; },
    save() { formData.name = document.getElementById('inp-name')?.value?.trim()||''; }
  },
  {
    tag:'General', q:"I'm currently based in...",
    skip(){ return onlyIfEmpty(formData.country); },
    html() {
      return `
        <div style="margin-bottom:1rem">
          <label class="fl-sm">Country</label>
          ${countrySelectHtml('inp-country', formData.country||'')}
        </div>
        <div>
          <label class="fl-sm">City</label>
          ${cityFieldHtml('inp-city', formData.country||'', formData.city||'')}
        </div>`;
    },
    validate() { return document.getElementById('inp-country')?.value ? null : 'Please select your country'; },
    save() { formData.country=document.getElementById('inp-country')?.value||''; formData.city=document.getElementById('inp-city')?.value?.trim()||''; }
  },
  {
    tag:'General', q:"What language do you speak?", hint:"Select language(s) and proficiency",
    skip(){ return onlyIfEmpty(formData.languages && Object.keys(formData.languages).length); },
    html() { return buildLangLevelHtml(); },
    validate() {
      const langs = formData.languages||{};
      if (!Object.keys(langs).length) return 'Please select at least one language';
      for (const [lk,lv] of Object.entries(langs)) {
        const def = LANGUAGES.find(l=>l.key===lk);
        if (!def) continue;
        if (def.variants.length===0) { if (!lv) return `Please select your level for ${def.label}`; }
        else {
          if (!lv||typeof lv!=='object'||!Object.keys(lv).length) return `Please select a variant for ${def.label}`;
          for (const [,vl] of Object.entries(lv)) { if (!vl) return `Please select a level for each ${def.label} variant`; }
        }
      }
      return null;
    },
    save() { /* formData.languages updated live */ }
  },
  {
    tag:'General', q:"I'm learning...", hint:"Select all that apply",
    skip(){ return onlyIfEmpty(formData.learnerLanguages && formData.learnerLanguages.length); },
    html() { return learnLangHtml(); },
    validate() { return (formData.learnerLanguages||[]).length>0 ? null : 'Please select at least one language'; },
    save() { /* maintained live by learnToggle / learnAddOther / learnRemoveOther */ }
  },
  {
    tag:'General', q:"I'm learning for...", hint:"Select all that apply",
    skip(){ return onlyIfEmpty(formData.learnerPurpose && formData.learnerPurpose.length); },
    html() {
      const saved=formData.learnerPurpose||[];
      const others=formData.learnerPurposeOther||'';
      return `
        <div class="chk-grp" id="learnerPurpGrp">
          ${[{v:'work',t:'Work / Business'},{v:'academia',t:'Academia'},{v:'travel',t:'Travel'},{v:'immigration',t:'Immigration'},{v:'personal',t:'Personal Interest'}].map(o=>`<button type="button" class="c-opt${saved.includes(o.v)?' sel':''}" data-val="${o.v}" onclick="toggleChk(this)">${o.t}</button>`).join('')}
          <button type="button" class="c-opt${saved.includes('others')?' sel':''}" data-val="others" onclick="toggleChkOther(this,'learnerPurpOtherRev')">Others</button>
        </div>
        <div class="cond${saved.includes('others')?' show':''}" id="learnerPurpOtherRev">
          <input type="text" class="fi" id="inp-learnerPurpOther" placeholder="Please specify..." value="${esc(others)}">
        </div>`;
    },
    validate() { return document.querySelectorAll('#learnerPurpGrp .c-opt.sel').length>0?null:'Please select at least one option'; },
    save() {
      formData.learnerPurpose=Array.from(document.querySelectorAll('#learnerPurpGrp .c-opt.sel')).map(e=>e.dataset.val);
      formData.learnerPurposeOther=document.getElementById('inp-learnerPurpOther')?.value?.trim()||'';
    }
  },
  {
    tag:'General', q:"I'm looking for...", hint:"Select all that apply",
    skip(){ return onlyIfEmpty(formData.learnerLooking && formData.learnerLooking.length); },
    html() {
      const saved=formData.learnerLooking||[];
      const others=formData.learnerLookingOther||'';
      return `
        <div class="chk-grp" id="learnerLookGrp">
          ${[{v:'tutor',t:'Tutor'},{v:'event',t:'Language Community Event'},{v:'study',t:'Study Group'},{v:'buddy',t:'Language Buddy'},{v:'resources',t:'Educational Resources'}].map(o=>`<button type="button" class="c-opt${saved.includes(o.v)?' sel':''}" data-val="${o.v}" onclick="toggleChk(this)">${o.t}</button>`).join('')}
          <button type="button" class="c-opt${saved.includes('others')?' sel':''}" data-val="others" onclick="toggleChkOther(this,'learnerLookOtherRev')">Others</button>
        </div>
        <div class="cond${saved.includes('others')?' show':''}" id="learnerLookOtherRev">
          <input type="text" class="fi" id="inp-learnerLookOther" placeholder="Please specify..." value="${esc(others)}">
        </div>`;
    },
    validate() { return document.querySelectorAll('#learnerLookGrp .c-opt.sel').length>0?null:'Please select at least one option'; },
    save() {
      formData.learnerLooking=Array.from(document.querySelectorAll('#learnerLookGrp .c-opt.sel')).map(e=>e.dataset.val);
      formData.learnerLookingOther=document.getElementById('inp-learnerLookOther')?.value?.trim()||'';
    }
  },
];

const ALL_SECTION_STEPS = { general: generalSteps };

// Fresh visitors see the intro splash; logged-in visitors are switched into
// completion/edit mode by the engine's onboardingInit(), which calls showForm().
showScreen('s-intro');
</script>
</body>
</html>
