<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="apple-touch-icon" href="../assets/img/favicon.png">
<title>Reset your password — Real lingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/site.css?v=19">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="login-wrap">
  <form class="login-card" id="fpForm" novalidate>
    <h1>Forgot password?</h1>
    <p class="lc-sub">Enter your email and we'll send you a link to reset your password.</p>

    <div class="lc-msg" id="fp-msg"></div>

    <div class="lc-field">
      <label for="fp-email">Email</label>
      <input type="email" id="fp-email" placeholder="you@example.com" autocomplete="email">
    </div>

    <button type="submit" class="lc-submit" id="fp-submit">Send reset link</button>
    <p class="lc-note"><a href="../login/">Back to login</a></p>
  </form>
</main>

<div id="site-footer"></div>

<script>
  window.SITE_ROOT = "../";
  window.SITE_SECTION = null;
  window.SITE_PAGE = "forgot-password";
</script>
<script src="../assets/js/nav.js?v=19" defer></script>
<script src="../assets/js/supabase-client.js?v=19"></script>
<script src="../assets/js/auth.js?v=19"></script>
<script>
(function () {
  const form = document.getElementById('fpForm');
  const emailEl = document.getElementById('fp-email');
  const btn = document.getElementById('fp-submit');
  const msg = document.getElementById('fp-msg');

  function showMsg(t, ok) { msg.textContent = t; msg.className = 'lc-msg ' + (ok ? 'ok' : 'err'); }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMsg('Please enter a valid email address.'); return; }
    btn.disabled = true; const o = btn.textContent; btn.textContent = 'Sending…';
    try {
      const redirectTo = new URL(SITE_ROOT + 'reset-password/', location.href).href;
      await RA.resetPassword(email, redirectTo);
      // Always show success (don't reveal whether an account exists).
      showMsg("If an account exists for that email, a reset link is on its way.", true);
      form.querySelector('.lc-submit').textContent = 'Email sent';
    } catch (err) {
      btn.disabled = false; btn.textContent = o;
      showMsg((err && err.message) || 'Could not send the reset email.');
    }
  });
})();
</script>
</body>
</html>
